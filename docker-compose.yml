services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db
    env_file:
      - ./.env

  db:
    image: postgres:16.3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: ${DB_HOST}


  redis:
    image: redis:7-alpine
    container_name: redis

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app

    depends_on:
      - web
      - db
      - redis
    command: celery -A config worker -l INFO --pool=solo

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis


    volumes:
      - .:/app
    depends_on:
      - celery
      - web
      - db
      - redis
    command: celery -A config beat -l INFO

networks:
  default:

volumes:
  postgres_data:
  static_volume: